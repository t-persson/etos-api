# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. Triggers the workflow on push or pull request
# events
on: [push, pull_request]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  run-tox:
    name: run-tox
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under , so your job can access it
      - uses: actions/checkout@v6

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.15'
      - name: Install Tox
        run: pip install tox
      - name: Upgrade setuptools
        run: pip install -U setuptools
      - name: Run Tox
        run: tox
        working-directory: ./python
  run-gotest:
    name: run-gotest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.26' ]
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - name: Go test
        run: make test
  run-hadolint:
    name: run-hadolint (${{ matrix.image }})
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: API
            dockerfile: Dockerfile
          - image: SSE
            dockerfile: deploy/etos-sse/Dockerfile
          - image: KeyService
            dockerfile: deploy/etos-keys/Dockerfile
          - image: LogArea
            dockerfile: deploy/etos-logarea/Dockerfile
          - image: Iut
            dockerfile: deploy/etos-iut/Dockerfile
          - image: ExecutionSpace
            dockerfile: deploy/etos-executionspace/Dockerfile

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under , so your job can access it
      - uses: actions/checkout@v6

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

  build-docker-images:
    name: build-docker-images (${{ matrix.image }})
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: API
            dockerfile: ./Dockerfile
            build_args: BUILD_REVISION=${{ github.sha }}
          - image: SSE
            dockerfile: ./deploy/etos-sse/Dockerfile
            build_args: BUILD_REVISION=${{ github.sha }}
          - image: KeyService
            dockerfile: ./deploy/etos-keys/Dockerfile
            build_args: BUILD_REVISION=${{ github.sha }}
          - image: LogArea
            dockerfile: ./deploy/etos-logarea/Dockerfile
            build_args: BUILD_REVISION=${{ github.sha }}
          - image: Iut
            dockerfile: ./deploy/etos-iut/Dockerfile
            build_args: BUILD_REVISION=${{ github.sha }}
          - image: ExecutionSpace
            dockerfile: ./deploy/etos-executionspace/Dockerfile
            build_args: BUILD_REVISION=${{ github.sha }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under , so your job can access it
      - uses: actions/checkout@v6

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
